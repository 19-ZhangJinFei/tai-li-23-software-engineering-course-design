version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: medical-rag-backend
    ports:
      - "8000:8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - CHROMA_DB_PATH=/app/chroma_db
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-default-secret-change-me}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_HOURS=24
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    depends_on:
      - redis
    networks:
      - rag_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: medical-rag-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rag_network
    restart: unless-stopped

  redis:
    image: redis:6.0.8-alpine
    container_name: medical-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:

networks:
  rag_network:
    driver: bridge
